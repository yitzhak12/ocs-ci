
apiVersion: batch/v1
kind: Job
metadata:
  name: fill-pool-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: fill-pool
    spec:
      restartPolicy: Never
      containers:
      - name: filler
        # fedora:fio provides GNU dd and openssl (needed for incompressible fill).
        image: quay.io/ocsci/fedora:fio
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            echo "Filling PVC with incompressible data..."
            openssl enc -aes-128-ctr -nosalt -pass pass:ocs-ci-fill -in /dev/zero 2>/dev/null \
              | dd of=/mnt/fill/testfile bs=${BLOCK_SIZE:-4M} oflag=direct
        env:
        - name: BLOCK_SIZE
          value: "4M"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
          - name: volume
            mountPath: /mnt/fill
      volumes:
        - name: volume
          persistentVolumeClaim:
            claimName: fill-pool-pvc
